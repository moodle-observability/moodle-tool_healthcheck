# Open source Nginx has no active health checks: the readiness endpoint is not called.
# Passive checks only mark a server as unavailable after failed requests:
upstream moodle {
    server 10.0.0.11:80 max_fails=3 fail_timeout=30s;
    server 10.0.0.12:80 max_fails=3 fail_timeout=30s;
}

