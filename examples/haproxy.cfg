# Example HAProxy backend using the readiness endpoint of tool_healthcheck.
# MOODLE_HEALTHCHECK_TOKEN comes from the environment of HAProxy (never write the token in this file).
backend moodle
    option httpchk
    http-check send meth GET uri /admin/tool/healthcheck/ready.php ver HTTP/1.1 hdr Host moodle.example.com hdr Authorization "Bearer ${MOODLE_HEALTHCHECK_TOKEN}"
    http-check expect status 200
    server web1 10.0.0.11:80 check inter 10s fall 3 rise 2
    server web2 10.0.0.12:80 check inter 10s fall 3 rise 2
